spring.application.name=store
server.port=8090
#spring.datasource.url=jdbc:h2:file:./ims_data
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=
#spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true
security.ignored=/**

# JWT - override via the JWT_SECRET env var. Placeholder is padded to 32 bytes
# only because HS256 throws at runtime otherwise - still must be replaced.
app.jwt.secret=${JWT_SECRET:placeholder-placeholder-placeholder}
app.jwt.expiration-ms=3600000
