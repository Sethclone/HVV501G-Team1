spring.application.name=store
server.port=8090
spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.username=
#spring.datasource.password=
spring.jpa.generate-ddl=true

# JWT - override via the JWT_SECRET env var. Placeholder is padded to 32 bytes
# only because HS256 throws at runtime otherwise - still must be replaced.
app.jwt.secret=${JWT_SECRET:placeholder-placeholder-placeholder}
app.jwt.expiration-ms=3600000
