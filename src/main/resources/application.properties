spring.application.name=store
server.port=${PORT:8090}
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${pgusername}
spring.datasource.password=${pgpassword}
spring.jpa.generate-ddl=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# JWT - override via the JWT_SECRET env var. Placeholder is padded to 32 bytes
# only because HS256 throws at runtime otherwise - still must be replaced.
app.jwt.secret=${JWT_SECRET:placeholder-placeholder-placeholder}
app.jwt.expiration-ms=3600000
